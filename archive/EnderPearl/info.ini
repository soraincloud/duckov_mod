description = 版本 / Version: v1.0.7｜更新 / Updated: 2026-03-18\n更新内容 / Update Notes: 解决在手持末影珍珠时掉帧严重的问题。 / Fixed the severe frame drops that could happen while holding the Ender Pearl.\n简介 / Summary: 新增可投掷道具“末影珍珠”，首次碰撞落地时会将角色传送到落点。 / Adds a throwable Ender Pearl that teleports the player to the landing point on first impact.\n核心功能 / Features: 传送时触发粒子与音效表现，支持快速位移、跨越地形和战斗走位，并优化手持时的模型表现以减少严重掉帧。 / Includes particle and sound effects for teleportation, supports fast repositioning, terrain traversal, and combat mobility, and improves handheld model performance to reduce severe frame drops.\n获取方式 / Obtain: NPC 橘子处购买（$1000）。 / Buy it from the Orange NPC for $1000.\n作者 / Credits: soraincloud｜策划 / Design: 吱吱歪\n声明 / Disclaimer: 本 Mod 为开源项目，使用 AI 辅助开发。 / This mod is open source and was developed with AI assistance.

