name = GoldenApple
displayName = 金苹果
description = 版本 / Version: v1.0.2｜更新 / Updated: 2026-03-18\n更新内容 / Update Notes: 提高生命上限与持续回血数值，补充工作台配方，并解决物品丢出来时贴图过小的问题。 / Increased max health and regeneration values, added the workbench recipe to the description, and fixed the dropped world sprite being too small.\n简介 / Summary: 新增一个可食用物品“附魔金苹果”，食用后获得临时生命上限、持续回血与护甲增益，并支持通过工作台制作。 / Adds an edible Enchanted Golden Apple that grants temporary max health, regeneration, and armor bonuses, and can also be crafted at the workbench.\n核心功能 / Features: +30 生命上限持续 2 分钟；30 秒内每秒回复 15 点生命；头甲与身甲各 +1.5 持续 5 分钟，并在左下角状态栏显示增益与剩余时间；支持工作台配方 `8x 金锭 + 1x 苹果`；地面掉落贴图显示放大一倍。 / Grants +30 max health for 2 minutes, restores 15 HP per second for 30 seconds, adds +1.5 head/body armor for 5 minutes, shows each active effect with remaining time in the lower-left buff bar, supports the workbench recipe `8x Gold Ingot + 1x Apple`, and enlarges the dropped world sprite.\n获取 / Availability: 可在装备商人橘子处购买，售价 6666；也可在工作台用 8 个 MC 金锭加 1 个苹果制作。 / Sold by Merchant_Equipment for 6666, or craft at the workbench with 8 MC Gold Ingots and 1 apple.\n兼容 / Compatibility: 属于 MC 系列 Mod，兼容 MC 前置分类，工作台配方依赖 MC 前置提供的共享金锭。 / Compatible with the MC prerequisite shared category, and its workbench recipe depends on the shared gold ingot from MCPrerequisite.\n作者 / Credits: soraincloud｜策划 / Design: 吱吱歪

