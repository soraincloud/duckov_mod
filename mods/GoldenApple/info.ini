description = 版本 / Version: v1.0.1｜更新 / Updated: 2026-03-18\n简介 / Summary: 新增一个可食用物品“附魔金苹果”，食用后获得临时生命上限、持续回血与护甲增益。 / Adds an edible Enchanted Golden Apple that grants temporary max health, regeneration, and armor bonuses.\n核心功能 / Features: +30 生命上限持续 2 分钟；30 秒内每秒回复 15 点生命；头甲与身甲各 +1.5 持续 5 分钟，并在左下角状态栏显示增益与剩余时间；地面掉落贴图显示放大一倍。 / Grants +30 max health for 2 minutes, restores 15 HP per second for 30 seconds, adds +1.5 head/body armor for 5 minutes, shows each active effect with remaining time in the lower-left buff bar, and doubles the dropped world sprite size.\n获取 / Availability: 可在装备商人橘子处购买，售价 6666。 / Sold by Merchant_Equipment for 6666.\n兼容 / Compatibility: 属于 MC 系列 Mod，兼容 MC 前置分类。 / Compatible with the MC prerequisite shared category.\n作者 / Credits: soraincloud｜策划 / Design: 吱吱歪

