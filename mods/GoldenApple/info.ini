description = 版本 / Version: v1.0.0｜更新 / Updated: 2026-03-17\n简介 / Summary: 新增一个可食用物品“金苹果”，食用后获得临时生命上限、持续回血与护甲增益。 / Adds an edible Golden Apple that grants temporary max health, regeneration, and armor bonuses.\n核心功能 / Features: +20 生命上限持续 2 分钟；30 秒内每秒回复 5 点生命；头甲与身甲各 +1.5 持续 5 分钟。 / Grants +20 max health for 2 minutes, restores 5 HP per second for 30 seconds, and adds +1.5 head/body armor for 5 minutes.\n兼容 / Compatibility: 属于 MC 系列 Mod，兼容 MC 前置分类。 / Compatible with the MC prerequisite shared category.\n作者 / Credits: soraincloud｜策划 / Design: 吱吱歪

