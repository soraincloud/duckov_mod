name = SplashHealingPotion
displayName = 喷溅治疗药水
description = 版本 / Version: v1.0.2｜更新 / Updated: 2026-03-18\n更新内容 / Update Notes: 补充命中反馈与音效反馈，治疗药水价格减半，新增两套工作台配方、单次制作改为 2 瓶，并将模型统一调整为 66% 大小。 / Added hit feedback and sound feedback, halved the potion price, added two workbench recipes that each produce 2 bottles, and resized the model to 66%.\n简介 / Summary: 新增一个可投掷物品，命中落地后会在范围内为角色恢复 50% 最大生命值，并爆开带发白高光感的莓果玫红粒子；当前也支持两套工作台配方。 / Adds a throwable item that heals characters in an area for 50% of their max health on impact, with berry rose particles and soft pale highlights, and it now supports two workbench recipes.\n核心功能 / Features: 复用末影珍珠式投掷手感，落地触发范围治疗、带发白高光感的莓果玫红爆裂粒子与音效反馈，并在命中时提供准星治疗反馈；支持两套工作台配方且每次产出 2 瓶；模型统一缩放到 66%。 / Reuses the Ender Pearl style throwing arc, then triggers area healing, berry rose burst particles with soft pale highlights, landing SFX, and a crosshair healing hit indicator on impact; supports two workbench recipes that each yield 2 bottles; the model is scaled to 66%.\n获取方式 / Obtain: NPC 橘子处购买（$1000），或通过工作台使用 `6x 止血绷带 + 2x 小急救箱 + 1x 恢复针` 或 `3x 玻璃 + 1x 恢复针` 制作，每次获得 2 瓶。 / Buy it from the Orange NPC for $1000, or craft it at the workbench with `6x Bandage + 2x Small First Aid Kit + 1x Recovery Shot` or `3x Glass + 1x Recovery Shot`, producing 2 bottles each time.\n作者 / Credits: soraincloud｜策划 / Design: 吱吱歪\n声明 / Disclaimer: 本 Mod 为开源项目，使用 AI 辅助开发。 / This mod is open source and was developed with AI assistance.

