description = 版本 / Version: v1.0.1｜更新 / Updated: 2026-03-18\n更新内容 / Update Notes: 治疗药水价格减半，工作台单次制作改为 2 瓶，并将模型统一调整为 66% 大小。 / Halved the potion price, changed each crafting run to produce 2 bottles, and resized the model to 66%.\n简介 / Summary: 新增一个可投掷物品，命中落地后会在范围内为角色恢复 50% 最大生命值，并爆开带发白高光感的莓果玫红粒子。 / Adds a throwable item that heals characters in an area for 50% of their max health on impact, with berry rose particles and soft pale highlights.\n核心功能 / Features: 复用末影珍珠式投掷手感，落地触发范围治疗、带发白高光感的莓果玫红爆裂粒子与音效反馈；工作台每次制作产出 2 瓶；模型统一缩放到 66%。 / Reuses the Ender Pearl style throwing arc, then triggers area healing, berry rose burst particles with soft pale highlights, and landing SFX on impact; each craft now yields 2 bottles; the model is scaled to 66%.\n获取方式 / Obtain: NPC 橘子处购买（$1000），或通过工作台制作每次获得 2 瓶。 / Buy it from the Orange NPC for $1000, or craft it at the workbench for 2 bottles per recipe.\n作者 / Credits: soraincloud｜策划 / Design: 吱吱歪\n声明 / Disclaimer: 本 Mod 为开源项目，使用 AI 辅助开发。 / This mod is open source and was developed with AI assistance.

