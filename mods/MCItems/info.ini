description = 版本 / Version: v1.0.0｜更新 / Updated: 2026-03-20\n简介 / Summary: 将末影珍珠、附魔金苹果、喷溅治疗药水、不死图腾四个 MC 系列物品合并为一个统一 Mod。 / Combines Ender Pearl, Enchanted Golden Apple, Splash Healing Potion, and Totem of Undying into one unified MC item mod.\n核心功能 / Features: 保留四个独立物品的购买、配方、音效、模型与效果逻辑，并统一打包在单一目录与单一 dll 中，便于启用、部署和后续维护。 / Preserves the four items' shop entries, crafting recipes, sounds, models, and gameplay behaviors while packaging them into one directory and one DLL for easier activation, deployment, and maintenance.\n兼容 / Compatibility: 继续兼容 MC 前置提供的共享材料与分类标签。 / Remains compatible with MCPrerequisite shared materials and category tags.\n作者 / Credits: soraincloud｜策划 / Design: 吱吱歪\n声明 / Disclaimer: 本 Mod 为合并归档版本，使用 AI 辅助整理。 / This is a merged archival version of the mod set, organized with AI assistance.

