description = 版本 / Version: v1.0.0｜更新 / Updated: 2026-03-17\n更新内容 / Update Notes: 修复退出并重新进入游戏后，放在图腾栏位中的不死图腾会消失的问题。 / Fixed an issue where the Totem of Undying could disappear from the totem slot after leaving and re-entering the game.\n简介 / Summary: 新增物品“不死图腾”，放入图腾槽位后即可生效。 / Adds a Totem of Undying item that becomes active when placed in the totem slot.\n核心功能 / Features: 受到致命伤害时消耗 1 个图腾，免除本次死亡，恢复 30% 最大生命，并获得 5 秒无敌；同时提供移速加成。 / Consumes 1 totem on lethal damage, prevents death, restores 30% max HP, grants 5 seconds of invulnerability, and also provides movement speed bonuses.\n获取方式 / Obtain: NPC 橘子处购买（$8400），同时支持工作台制作。 / Buy it from the Orange NPC for $8400 or craft it at the workbench.\n作者 / Credits: soraincloud｜策划 / Design: 吱吱歪\n声明 / Disclaimer: 本 Mod 为开源项目，使用 AI 辅助开发。 / This mod is open source and was developed with AI assistance.

