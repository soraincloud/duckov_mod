description = 版本 / Version: v1.0.0｜更新 / Updated: 2026-03-19\n更新内容 / Update Notes: 扩展共享材料物品，当前直接托管玻璃、铁粒、铁锭、铁块、金粒、金锭、金块 7 个 MC 材料物品，并补充地图容器刷新逻辑。 / Expanded the shared material set to seven MC material items and added map lootbox spawn support.\n简介 / Summary: 作为所有 MC 系列 Mod 的公共前置，统一注册工作台与仓库中的 MC 分类，并直接托管玻璃、铁粒、铁锭、铁块、金粒、金锭、金块 7 个共享材料物品。 / Shared prerequisite for all MC-style mods, providing a unified MC category in workbench and storage UI while directly managing Glass, Iron Nugget, Iron Ingot, Iron Block, Gold Nugget, Gold Ingot, and Gold Block.\n核心功能 / Features: 统一注入 MC 分类按钮、处理场景切换与仓库加载后的分类恢复，并提供共享材料与 `MC材料` 分类，同时向地图容器补充共享材料随机刷新逻辑，避免各个 MC Mod 重复实现同一套分类与材料分发逻辑。 / Injects the shared MC category button, reapplies it after scene/storage reloads, provides the shared `MC材料` category, and adds shared material distribution to map lootboxes to avoid duplicate implementations across MC mods.\n作者 / Credits: soraincloud｜策划 / Design: 吱吱歪\n声明 / Disclaimer: 本 Mod 为开源项目，使用 AI 辅助开发。 / This mod is open source and was developed with AI assistance.

