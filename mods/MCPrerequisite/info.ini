description = 版本 / Version: v1.0.0｜更新 / Updated: 2026-03-18\n更新内容 / Update Notes: 补充共享材料物品说明，当前直接托管玻璃、铁锭、金锭 3 个 MC 材料物品。 / Updated the description to cover the three shared MC material items managed by this prerequisite.\n简介 / Summary: 作为所有 MC 系列 Mod 的公共前置，统一注册工作台与仓库中的 MC 分类，并直接托管玻璃、铁锭、金锭 3 个共享材料物品。 / Shared prerequisite for all MC-style mods, providing a unified MC category in workbench and storage UI while directly managing Glass, Iron Ingot, and Gold Ingot.\n核心功能 / Features: 统一注入 MC 分类按钮、处理场景切换与仓库加载后的分类恢复，并提供共享材料与 `MC材料` 分类，避免各个 MC Mod 重复实现同一套分类逻辑。 / Injects the shared MC category button, reapplies it after scene/storage reloads, and provides shared materials plus the `MC材料` category to avoid duplicate implementations across MC mods.\n作者 / Credits: soraincloud｜策划 / Design: 吱吱歪\n声明 / Disclaimer: 本 Mod 为开源项目，使用 AI 辅助开发。 / This mod is open source and was developed with AI assistance.

