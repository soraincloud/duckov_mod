description = 版本 / Version: v1.2.0｜更新 / Updated: 2026-03-16\n更新内容 / Update Notes: 倒计时结束后若仓库现金不足，不再只删除一次，而是改为每 5 秒持续随机删除一个仓库物品。 / If storage cash is insufficient after the countdown, the mod now keeps deleting one random storage item every 5 seconds instead of deleting only once.\n简介 / Summary: 进入关卡后会自动开始 10 秒倒计时，结束时优先从仓库中的现金物品扣除 $168。 / Starts a 10-second countdown after entering a level, then deducts $168 from cash items in player storage first.\n核心功能 / Features: 若仓库现金不足，则进入持续毁号状态，每 5 秒随机删除一个仓库物品，并弹出提示显示删除了什么。 / If storage cash is insufficient, it enters repeated destruction mode and deletes one random storage item every 5 seconds with a notice naming the removed item.\n特别提醒 / Notice: 本 Mod 可能对正常游玩体验造成负面影响，定位为朋友整活与娱乐用途，不鼓励恶意误导或破坏他人体验。 / This mod may negatively affect normal gameplay and is intended for joke or party use only, not for malicious misuse or harming other players' experience.\n触发方式 / Trigger: 自动生效，无需手动使用。 / Works automatically with no manual activation required.\n作者 / Credits: GitHub Copilot\n声明 / Disclaimer: 本 Mod 为本地自定义 Mod。 / This is a local custom mod.

